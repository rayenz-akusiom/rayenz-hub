version = 0.1

[default.global.parameters]
stack_name = "rayenz-hub-api"

[default.build.parameters]
cached = true
parallel = true
template_file = "infra/template.yaml"

[default.validate.parameters]
lint = true

[default.deploy.parameters]
template_file = ".aws-sam/build/template.yaml"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
# Create Secrets Manager secrets first (ssm-secure cannot be used in Lambda env vars).
# Cognito ids/secret are appended by scripts/deploy-api.mjs from the rayenz-hub-cognito stack.
parameter_overrides = "HubApiKeySecretId=rayenz-hub/prod/api-key HubInviteSecretId=rayenz-hub/prod/invite-hmac HubUserId=rayenz-local HubOwnerUsername=Rayenz"

# Placeholders so `sam local` can resolve required Cognito parameters; env.local overlay supplies the live pool.
# start:api passes this file via an absolute --config-file (SAM resolves that path relative to the template).
[default.local_start_api.parameters]
parameter_overrides = "CognitoUserPoolId=local CognitoUserPoolArn=arn:aws:cognito-idp:us-east-1:000000000000:userpool/local CognitoClientId=local CognitoClientSecret=local"

[cognito.global.parameters]
stack_name = "rayenz-hub-cognito"

[cognito.deploy.parameters]
template_file = "infra/cognito.yaml"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
