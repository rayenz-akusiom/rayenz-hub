<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Absolute dirs for Lambda (/var/task) and relative for local cwd. -->
  <dir>/var/task/assets/fonts</dir>
  <dir>assets/fonts</dir>
  <cachedir>/tmp/rayenz-fontconfig-cache</cachedir>
  <config>
    <rescan>
      <int>30</int>
    </rescan>
  </config>
</fontconfig>
