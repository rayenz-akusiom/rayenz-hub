AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Rayenz Hub API — local-first serverless backend

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs20.x
    MemorySize: 2048
    Architectures:
      - x86_64

Parameters:
  HubInviteSecretId:
    Type: String
    Default: ''
    Description: Secrets Manager secret name for HUB_INVITE_SECRET (e.g. rayenz-hub/prod/invite-hmac). Do not end the name with a hyphen plus six characters (CloudFormation treats that as a partial ARN). Empty = inline HubInviteSecret (local).
  HubInviteSecret:
    Type: String
    Default: local-invite-secret
    NoEcho: true
    Description: Inline invite HMAC for SAM local only. Production uses HubInviteSecretId.
  HubUserId:
    Type: String
    Default: default
    Description: Local partition user id (Rayenz Cognito sub after cutover). Not a browser identity.
  HubOwnerUsername:
    Type: String
    Default: Rayenz
  HubPagesOrigin:
    Type: String
    Default: https://rayenz-akusiom.github.io/rayenz-akusiom
  CognitoUserPoolId:
    Type: String
    Description: From rayenz-hub-cognito stack output HubUserPoolId (SAM local uses a placeholder; overlay supplies the live pool).
  CognitoUserPoolArn:
    Type: String
    Description: From rayenz-hub-cognito stack output HubUserPoolArn.
  CognitoClientId:
    Type: String
    Description: From rayenz-hub-cognito stack output HubUserPoolClientId.
  CognitoClientSecret:
    Type: String
    NoEcho: true
    Description: Cognito app client secret (DescribeUserPoolClient). Not stored in git.
  BudgetNotifyEmail:
    Type: String
    Default: ''
    Description: Optional email for AWS Budget alerts (in addition to SNS → lock Lambda).
  DynamoDbEndpoint:
    Type: String
    Default: ''
    Description: Leave empty for AWS; set to http://host.docker.internal:8000 for SAM local + DynamoDB Local
  S3Endpoint:
    Type: String
    Default: ''
    Description: Leave empty for AWS; set to http://host.docker.internal:9000 for SAM local + MinIO

Conditions:
  UseLocalDynamo: !Not [!Equals [!Ref DynamoDbEndpoint, '']]
  UseLocalS3: !Not [!Equals [!Ref S3Endpoint, '']]
  UseAwsSecrets: !Not [!Equals [!Ref HubInviteSecretId, '']]

Resources:
  HubTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HubTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  HubDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  HubBudgetTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rayenz-hub-budget
      DisplayName: Rayenz Hub budget alerts

  HubBudgetTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref HubBudgetTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref HubBudgetTopic

  HubMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: rayenz-hub-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 100
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref HubBudgetTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref HubBudgetTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 95
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref HubBudgetTopic

  SpendLockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../packages/api
      Handler: src/handlers/spend-lock-events.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          HUB_TABLE_NAME: !Ref HubTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HubTable
      Events:
        BudgetSns:
          Type: SNS
          Properties:
            Topic: !Ref HubBudgetTopic
        MonthStart:
          Type: Schedule
          Properties:
            Schedule: cron(5 0 1 * ? *)
            Input: '{"action":"clear","reason":"period_start"}'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/spend-lock-events.ts

  HubApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../packages/api
      Handler: src/handler.handler
      Environment:
        Variables:
          HUB_TABLE_NAME: !Ref HubTable
          HUB_BUCKET_NAME: !Ref HubDataBucket
          HUB_USER_ID: !Ref HubUserId
          HUB_OWNER_USERNAME: !Ref HubOwnerUsername
          HUB_PAGES_ORIGIN: !Ref HubPagesOrigin
          HUB_SUGGEST_DECK_CAP: '20'
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_CLIENT_SECRET: !Ref CognitoClientSecret
          HUB_INVITE_SECRET: !If
            - UseAwsSecrets
            - !Sub '{{resolve:secretsmanager:${HubInviteSecretId}:SecretString}}'
            - !Ref HubInviteSecret
          DYNAMODB_ENDPOINT: !If [UseLocalDynamo, !Ref DynamoDbEndpoint, !Ref AWS::NoValue]
          # Empty string (not NoValue) so `sam local --env-vars` can override for MinIO
          S3_ENDPOINT: !If [UseLocalS3, !Ref S3Endpoint, '']
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HubTable
        - S3CrudPolicy:
            BucketName: !Ref HubDataBucket
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:GlobalSignOut
                - cognito-idp:GetUser
              Resource: !Ref CognitoUserPoolArn
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:ResendConfirmationCode
              Resource: '*'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/health
            Method: GET
        SettingsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/settings/{domain}
            Method: GET
        SettingsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/settings/{domain}
            Method: PUT
        ProfilesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/profiles
            Method: GET
        ProfileGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/profiles/{deckId}
            Method: GET
        ProfilePut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/profiles/{deckId}
            Method: PUT
        DecksList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/decks
            Method: GET
        DeckGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/decks/{deckId}
            Method: GET
        PublicUserDeckGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/users/{username}/decks/{deckSlug}
            Method: GET
        DeckPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/decks/{deckId}
            Method: PUT
        DeckPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/decks/{deckId}
            Method: PATCH
        DeckDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/decks/{deckId}
            Method: DELETE
        DeckGlance:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/decks/{deckId}/glance
            Method: POST
        SwapsGlance:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/swaps/glance
            Method: POST
        ReviewProgressGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/review-progress/{fileId}
            Method: GET
        ReviewProgressPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/review-progress/{fileId}
            Method: PUT
        SetPoolGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/set-pools/{codesKey}
            Method: GET
        SetPoolPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/set-pools/{codesKey}
            Method: PUT
        SuggestGenerate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/suggest/generate
            Method: POST
        SuggestReleases:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/suggest/releases
            Method: GET
        AuthSignIn:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/auth/sign-in
            Method: POST
        AuthRegister:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/auth/register
            Method: POST
        AuthConfirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/auth/confirm
            Method: POST
        AuthResendConfirmation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/auth/resend-confirmation
            Method: POST
        AuthRefresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/auth/refresh
            Method: POST
        AuthSignOut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/auth/sign-out
            Method: POST
        AuthMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/auth/me
            Method: GET
        InvitesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/invites
            Method: POST
        InvitesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/invites
            Method: GET
        InvitesRevoke:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /v1/invites/{inviteId}/revoke
            Method: POST
        CorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HubHttpApi
            Path: /{proxy+}
            Method: OPTIONS
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handler.ts
        # Native module — must not be bundled (breaks Lambda init / SAM local).
        External:
          - sharp

  HubHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - PUT
          - POST
          - DELETE
          - OPTIONS

Outputs:
  HubApiUrl:
    Description: HTTP API endpoint
    Value: !Sub 'https://${HubHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  HubTableName:
    Value: !Ref HubTable
  HubDataBucketName:
    Value: !Ref HubDataBucket
